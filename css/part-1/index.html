<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
    <style>
        /* selector universal */
        /* * {
            color:red;
        } */

        /* selector type / tag element */
        body {
            background-color: burlywood;
        }
        button {
            background-color: aquamarine;
        }
        h2 {
            color: blue !important;
        }
        /* selector by class */
        .box {
            width: 300px;
            height: 300px;
            color: brown;
            background-color: blueviolet;
        }
        .box-rounded {
            border-radius: 10%;
        }
        .title {
            color: yellow;
        }
        /* selector by id */
        /* #card {
            width: 200px;
            height: 200px;
            background-color: brown;
        } */
        #judul {
            color: green;
        }
        .mobil {
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Hallo World</h1>
    <p>Hallo world 2</p>
    <span>Hallo world 3</span>
    <div>Hallo World 4</div>
    <button>Hallo world 5</button>
    <button>Hallo world 6</button>
    <div >
        <div>
            <div>
                <button>Hallo world 7</button>
            </div>
        </div>
    </div>
    <div class="box box-rounded">
        <span>Hallo World 8</span>
        <span>Hallo World 8</span>
        <p>Hallo world 8</p>
    </div>
    <div id="card">
        Hallo world 9
    </div>

    <h2 id="judul" class="title" style="color:black;">Hallo World 10</h2>
</body>
</html>
