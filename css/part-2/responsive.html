        .box {
            width: 100px;
            height: 100px;
            background-color: red;
        }
        .container {
            display: flex;
            flex-direction: row;
        }

        /* break point */
        @media (width <= 300px) and (max-width: 310px) {
            body {
                background-color: antiquewhite;
            }
            .box {
                background-color: green;
            }
        }
        /* break point */
        @media (min-width: 400px) {
            body {
                background-color: rgb(215, 248, 250);
            }
            .box {
                visibility: hidden;
                background-color: purple;
            }
            .container {
                flex-direction: column;
            }
        }

        .article {
            width: 400px;
            display: -webkit-box;
            -webkit-line-clamp: 8;
            -webkit-box-orient: vertical;
            overflow: hidden;

        }

        .article {
            transition: all .2s ease-in-out;
           
        }

         .article:hover {
             transform: translate(100px, 100px);
         }


    </style>
</head>
