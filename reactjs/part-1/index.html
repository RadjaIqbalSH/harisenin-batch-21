    <!-- DECLARATIVE VERSION -->
    <script type="text/babel" data-type="module" data-presets="react">
        import React from 'react';
        import { createRoot } from 'react-dom/client';

        const domNode = document.getElementById('app');

        const root = createRoot(domNode);
       
        function Title (props) {
            return (
                <h1 
                    className="" 
                    style={{
                        color: props.color || "black"
                    }} 
                    onClick={() => {}}
                >
                    {props.text}
                </h1>
            );  
        }

        function Card (props) {
            return (
                <div className="card">
                    <div className="card-head"> 
                        <Title text={props.title}/>
                    </div>
                    <div className="card-body">
                        <img src={props.imgUrl} style={{
                            width: "230px",
                            heigh: "230px",
                        }}/>
                        {props.children}
                    </div>
                    <p className="card-foot">
                        {props.description}
                    </p>
                </div>
            )
        }

        const data = [
            {
                id: 1,
                title: "Title 1",
                imgUrl: "../../cool-cat.jpg",
                description: "Card ini keren 1",
            },
            {
                id: 2,
                title: "Title 2",
                imgUrl: "../../cool-cat.jpg",
                description: "Card ini keren 2",
            },
            {
                id: 3,
                title: "Title 3",
                imgUrl: "../../cool-cat.jpg",
                description: "Card ini keren 3",
            },
            {
                id: 4,
                title: "Title 4",
                imgUrl: "../../cool-cat.jpg",
                description: "Card ini keren 3",
            },
            {
                id: 5,
                title: "Title 5",
                imgUrl: "../../cool-cat.jpg",
                description: "Card ini keren 3",
            },
        ]

        
        root.render(
            <div className="container">
                {
                    data.map((item) => (
                        <Card 
                            key={item.id}
                            title={item.title} 
                            description={item.description} 
                            imgUrl={item.imgUrl}
                        >
                            <button>Click Me</button>
                        </Card>
                    ))
                }
            </div>
        );
    </script>
