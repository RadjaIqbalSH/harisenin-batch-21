<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/login.css">
    <title>Document</title>
</head>
<body>
    <main class="container">
        <div class="login-container">
            <img class="logo" src="./assets/logo.png" alt="logo">
            <h1 class="heading-3">Masuk</h1>
            <p class="body-medium-regular">Selamat datang kembali!</p>
            <form class="login-form" action="">
                <div class="form-field">
                    <label class="body-large-medium" for="username">Username</label>
                    <input class="input-text" id="username" type="text" placeholder="Masukkan username">
                </div>
                <div class="form-field">
                    <label class="body-large-medium" for="pasword">Kata Sandi</label>
                    <input class="input-text" id="pasword" type="password" placeholder="Masukkan kata sandi">
                </div>
                <div class="form-info-wrapper">
                    <span class="body-medium-regular">Belum punya akun? <a class="body-medium-regular" href="">Daftar</a></span>
                    <a class="body-medium-regular" href="">Lupa kata sandi?</a>
                </div>
                <button class="btn-secondary-contained">Masuk</button>
                <span class="body-small-medium">Atau</span>
                <button class="btn-secondary-outlined">Masuk dengan Google</button>
            </form>
        </div>
    </main>
</body>
</html>
